name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit
      continue-on-error: true
    
    - name: Lint HTML/CSS/JS
      run: |
        echo "✓ HTML, CSS, JavaScript files present"
        test -f index.html && echo "✓ index.html found"
        test -d css && echo "✓ css directory found"
        test -d js && echo "✓ js directory found"
      continue-on-error: true
    
    - name: Check for syntax errors in JavaScript
      run: |
        node -c js/state.js
        node -c js/app.js
      continue-on-error: true
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.node-version }}
        path: |
          index.html
          css/
          js/
          data/
          images/
        retention-days: 7
      if: always()

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify deployment files
      run: |
        echo "✓ Deployment ready"
        echo "  - index.html exists: $(test -f index.html && echo 'yes' || echo 'no')"
        echo "  - CSS files: $(ls -1 css/*.css 2>/dev/null | wc -l) files"
        echo "  - JS files: $(find js -name '*.js' | wc -l) files"
